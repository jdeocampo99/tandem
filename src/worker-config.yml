retry:
  modelFallback: false
  usageAwareFallback: false
  usageReservePolicy: fail-closed
contextPromotion:
  enabled: false
compaction:
  enabled: true
prewalk:
  enabled: false
# ponytail: blocks OMP's bundled write-capable agents only; a repo's own agents can still be spawned.
task:
  disabledAgents: [task, sonic, reviewer, security-reviewer]
