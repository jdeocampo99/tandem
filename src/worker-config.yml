retry:
  modelFallback: false
  usageAwareFallback: false
  usageReservePolicy: fail-closed
contextPromotion:
  enabled: false
compaction:
  enabled: true
prewalk:
  enabled: false
# A command backgrounded past submit_report wakes the worker into a busy turn that blocks
# reusing its pane, so keep every command in the foreground.
async:
  enabled: false
bash:
  autoBackground:
    enabled: false
