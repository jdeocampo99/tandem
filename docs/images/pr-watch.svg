<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-labelledby="t d">
  <title id="t">How PR watch keeps a pull request moving</title>
  <desc id="d">PR watch checks your pull request on a schedule. It reruns flaky checks, merges the base in on conflicts, updates a branch that is behind, and requeues after a queue kick-out, then checks again. When everything is green it merges through auto-merge or your queue label. It comes to you only when a person is needed.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .muted { fill: #59636e; }
    .tag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
    .name { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12.5px; }
    .chiptext { font-size: 12.5px; }
    .ev { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
    .code { fill: #e7f6f3; stroke: #14b8a6; stroke-width: 1.5; }
    .codetag { fill: #0f766e; }
    .panel { fill: none; stroke: #14b8a6; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .chip { fill: #ffffff; stroke: #99d9cf; stroke-width: 1; }
    .done { fill: #eaf7ee; stroke: #22c55e; stroke-width: 1.5; }
    .donetag { fill: #15803d; }
    .you { fill: #fdf3e2; stroke: #f59e0b; stroke-width: 1.5; }
    .youtag { fill: #b45309; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .head { fill: #8c959f; }
    .edge { font-size: 12px; font-weight: 600; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted, .edge { fill: #9198a1; }
      .ev { fill: #151b23; stroke: #3d444d; }
      .code { fill: #0d2b28; stroke: #2dd4bf; }
      .codetag { fill: #5eead4; }
      .panel { stroke: #2dd4bf; }
      .chip { fill: #0a1f1d; stroke: #1f6f66; }
      .done { fill: #0f2a19; stroke: #4ade80; }
      .donetag { fill: #86efac; }
      .you { fill: #2e230f; stroke: #fbbf24; }
      .youtag { fill: #fcd34d; }
      .line { stroke: #6e7681; } .head { fill: #6e7681; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>

  <!-- handled on its own -->
  <rect class="panel" x="196" y="12" width="428" height="112" rx="12"/>
  <text class="tag codetag" x="214" y="34">HANDLED ON ITS OWN</text>
  <rect class="chip" x="214" y="46" width="196" height="30" rx="15"/><text class="chiptext" x="312" y="65.5" text-anchor="middle">Flaky check: reruns CI</text>
  <rect class="chip" x="418" y="46" width="190" height="30" rx="15"/><text class="chiptext" x="513" y="65.5" text-anchor="middle">Conflict: merges base in</text>
  <rect class="chip" x="214" y="84" width="196" height="30" rx="15"/><text class="chiptext" x="312" y="103.5" text-anchor="middle">Behind: updates the branch</text>
  <rect class="chip" x="418" y="84" width="190" height="30" rx="15"/><text class="chiptext" x="513" y="103.5" text-anchor="middle">Kicked from queue: requeues</text>

  <!-- your PR -->
  <rect class="ev" x="16" y="166" width="150" height="64" rx="10"/>
  <text class="name" x="91" y="195" text-anchor="middle">Your PR</text>
  <text class="sub muted" x="91" y="214" text-anchor="middle">Tandem's or yours</text>
  <line class="line" x1="168" y1="198" x2="252" y2="198" marker-end="url(#arrow)"/>

  <!-- hub -->
  <rect class="code" x="256" y="160" width="308" height="76" rx="10"/>
  <text class="tag codetag" x="410" y="183" text-anchor="middle">PR WATCH</text>
  <text class="name" x="410" y="206" text-anchor="middle">Checks CI, conflicts, and reviews</text>
  <text class="sub muted" x="410" y="225" text-anchor="middle">on a schedule, while Tandem is open</text>

  <!-- loop between hub and panel -->
  <line class="line" x1="370" y1="158" x2="370" y2="128" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="128" x2="450" y2="156" marker-end="url(#arrow)"/>

  <!-- merged -->
  <line class="line" x1="566" y1="198" x2="700" y2="198" marker-end="url(#arrow)"/>
  <text class="edge" x="633" y="186" text-anchor="middle">all green</text>
  <rect class="done" x="704" y="160" width="240" height="76" rx="10"/>
  <text class="tag donetag" x="722" y="183">MERGED</text>
  <text class="name" x="722" y="206">Merges when you publish</text>
  <text class="sub muted" x="722" y="225">through auto-merge or your queue</text>

  <!-- needs you -->
  <line class="line" x1="410" y1="238" x2="410" y2="268" marker-end="url(#arrow)"/>
  <rect class="you" x="196" y="272" width="428" height="104" rx="10"/>
  <text class="tag youtag" x="214" y="295">COMES TO YOU</text>
  <text class="name" x="214" y="318">Only when a person is needed</text>
  <text class="sub muted" x="214" y="341">A check fails twice, a check is stuck, a conflict it</text>
  <text class="sub muted" x="214" y="360">can't fix, or a reviewer asks for changes</text>
</svg>
