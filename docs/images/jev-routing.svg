<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">How Jev routes a prompt</title>
  <desc id="d">A prompt goes to the Jev classifier, which picks from options Tandem's code lists. A confident match runs in code with no model turn. Anything else goes to the coordinator for a full model turn.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .muted { fill: #59636e; }
    .tag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
    .name { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12.5px; }
    .ev { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
    .jev { fill: #eef4ff; stroke: #3b82f6; stroke-width: 1.5; }
    .jevtag { fill: #1d4ed8; }
    .code { fill: #e7f6f3; stroke: #14b8a6; stroke-width: 1.5; }
    .codetag { fill: #0f766e; }
    .model { fill: #f3eefe; stroke: #8b5cf6; stroke-width: 1.5; }
    .modeltag { fill: #6d28d9; }
    .chip { fill: #ffffff; stroke: #99d9cf; stroke-width: 1; }
    .chiptext { font-size: 12.5px; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .head { fill: #8c959f; }
    .edge { font-size: 12px; font-weight: 600; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted, .edge { fill: #9198a1; }
      .ev { fill: #151b23; stroke: #3d444d; }
      .jev { fill: #111d33; stroke: #60a5fa; }
      .jevtag { fill: #93c5fd; }
      .code { fill: #0d2b28; stroke: #2dd4bf; }
      .codetag { fill: #5eead4; }
      .model { fill: #251b3d; stroke: #a78bfa; }
      .modeltag { fill: #c4b5fd; }
      .chip { fill: #0a1f1d; stroke: #1f6f66; }
      .line { stroke: #6e7681; } .head { fill: #6e7681; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>

  <!-- prompt -->
  <rect class="ev" x="16" y="128" width="150" height="64" rx="10"/>
  <text class="name" x="91" y="157" text-anchor="middle">Your prompt</text>
  <text class="sub muted" x="91" y="176" text-anchor="middle">in the coordinator</text>

  <line class="line" x1="168" y1="160" x2="208" y2="160" marker-end="url(#arrow)"/>

  <!-- jev -->
  <rect class="jev" x="212" y="112" width="216" height="96" rx="10"/>
  <text class="tag jevtag" x="320" y="134" text-anchor="middle">JEV CLASSIFIER</text>
  <text class="name" x="320" y="158" text-anchor="middle">Picks one option</text>
  <text class="sub muted" x="320" y="177" text-anchor="middle">from the list code gives it</text>
  <text class="sub muted" x="320" y="195" text-anchor="middle">$0.042 per million input tokens</text>

  <!-- branches -->
  <path class="line" d="M430,145 C470,145 470,84 510,84" marker-end="url(#arrow)"/>
  <text class="edge" x="486" y="72" text-anchor="middle">≥ 0.80</text>
  <path class="line" d="M430,175 C470,175 470,254 510,254" marker-end="url(#arrow)"/>
  <text class="edge" x="480" y="276" text-anchor="middle">otherwise</text>

  <!-- code path -->
  <rect class="code" x="514" y="16" width="430" height="136" rx="10"/>
  <text class="tag codetag" x="532" y="40">HANDLED IN CODE</text>
  <text class="name" x="532" y="63">Answered instantly, no model turn</text>
  <rect class="chip" x="532" y="78" width="120" height="28" rx="14"/><text class="chiptext" x="592" y="96.5" text-anchor="middle">how's it going?</text>
  <rect class="chip" x="662" y="78" width="130" height="28" rx="14"/><text class="chiptext" x="727" y="96.5" text-anchor="middle">how are my PRs?</text>
  <rect class="chip" x="802" y="78" width="124" height="28" rx="14"/><text class="chiptext" x="864" y="96.5" text-anchor="middle">yeah restart it</text>
  <rect class="chip" x="532" y="112" width="190" height="28" rx="14"/><text class="chiptext" x="627" y="130.5" text-anchor="middle">pull up the dark mode brief</text>
  <rect class="chip" x="732" y="112" width="194" height="28" rx="14"/><text class="chiptext" x="829" y="130.5" text-anchor="middle">why did that task stall?</text>

  <!-- coordinator path -->
  <rect class="model" x="514" y="190" width="430" height="100" rx="10"/>
  <text class="tag modeltag" x="532" y="214">COORDINATOR</text>
  <text class="name" x="532" y="237">Full model turn</text>
  <text class="sub muted" x="532" y="258">Unclear or mixed requests, anything that changes state,</text>
  <text class="sub muted" x="532" y="276">low confidence, or Jev unavailable</text>

  <text class="sub muted" x="16" y="318">Jev never approves or authorizes anything. Approving a brief this way still asks you to type y.</text>
</svg>
